name: Birthday Owner Notify

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: birthday-owner-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify BIRTHDAY_CRON_SECRET is configured
        env:
          BIRTHDAY_CRON_SECRET: ${{ secrets.BIRTHDAY_CRON_SECRET }}
        run: |
          if [ -z "${BIRTHDAY_CRON_SECRET}" ]; then
            echo "BIRTHDAY_CRON_SECRET is not configured"
            exit 1
          fi

      - name: Call birthday owner notify endpoint
        env:
          BIRTHDAY_CRON_SECRET: ${{ secrets.BIRTHDAY_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "x-cron-secret: ${BIRTHDAY_CRON_SECRET}" \
            "https://ai-salon-admin.onrender.com/api/internal/birthday-owner-notify"
